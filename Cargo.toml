[workspace]
members = [ "application", "node", "rpc", "types", "finalizer", "orchestrator", "syncer"]
resolver = "3"

[workspace.package]
version = "0.0.3-alpha"
edition = "2024"

[workspace.dependencies]
# Our crates
summit-types = { path = "types" }
summit-application = { path = "application" }
summit-syncer = {path = "syncer" }
summit-finalizer = {path = "finalizer"}
summit-rpc = {path = "rpc"}
summit-orchestrator = {path = "orchestrator"}

commonware-actor = "2026.9.0"
commonware-formatting = "2026.9.0"
commonware-consensus = "2026.9.0"
commonware-cryptography = "2026.9.0"
commonware-storage = "2026.9.0"
commonware-runtime = "2026.9.0"
commonware-codec = "2026.9.0"
commonware-p2p = "2026.9.0"
commonware-broadcast = "2026.9.0"
commonware-utils = "2026.9.0"
commonware-resolver = "2026.9.0"
commonware-macros = "2026.9.0"
commonware-math = "2026.9.0"
commonware-parallel = "2026.9.0"

# Exact-pinned to the same alloy release seismic-reth uses so the two sides of
# the Engine API never drift across a minor version.
alloy-consensus = "=1.1.0"
alloy-eips = { version = "=1.1.0", features = ["ssz"] }
alloy-genesis = "=1.1.0"
alloy-network = "=1.1.0"
alloy-node-bindings = "=1.1.0"
alloy-rpc-client = "=1.1.0"
alloy-rpc-types = "=1.1.0"
alloy-rpc-types-engine = { version = "=1.1.0", features = ["serde", "ssz"] }
alloy-signer = "=1.1.0"
alloy-signer-local = "=1.1.0"
alloy-transport = "=1.1.0"
# No `hyper` here: nothing uses alloy's hyper transport (the engine API is
# over IPC), and the feature hard-wires hyper-tls, i.e. OpenSSL.
alloy-provider = { version = "=1.1.0", default-features = false, features = [
    "engine-api",
    "ipc",
    "reqwest",
    "reqwest-rustls-tls",
] }
alloy-primitives = "1.3.1"
alloy-transport-ipc = { version = "=1.1.0" }

# Engine API wire types shared with seismic-reth (payload attributes / execution payloads that
# carry the sub-second `timestampMillisPart`). Stock-alloy only; the `ssz` feature is what
# `summit_types::Block` hashes. Pin to the seismic-reth commit the network runs.
reth-seismic-engine-types = { git = "https://github.com/SeismicSystems/seismic-reth.git", branch = "seismic", default-features = false, features = ["std", "ssz"] }
url = "2.5"

futures = "0.3.31"
http = "1.0"
hex = "0.4"
http-body-util = "0.1.3"
# rustls, not the default native-tls: the release binary is downloaded onto
# machines we do not control and must not link the host's OpenSSL. Every
# reqwest in the graph must agree, since Cargo unifies its features — the
# `alloy` crates below choose `reqwest-rustls-tls` for the same reason, and the
# release workflow fails the build if libssl shows up in the binary.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
socket2 = "0.6"
tower = "0.5.2"
tokio = "1.46.0"
tokio-util = "0.7.16"
console-subscriber = "0.4"
pin-project = "1.1.10"
jsonrpsee = { version = "0.26.0", features = ["http-client"] }

ethereum_hashing = { version = "0.8", features = ["zero_hash_cache"] }
ethereum_ssz = "0.9.0"
ethereum_ssz_derive = "0.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.9.8"
zeroize = "1.8"

anyhow = "1.0.99"
eyre = "0.6"

bytes = "1.10.1"
clap = { version = "4.5.40", features = ["derive"] }
curve25519-dalek = "4.1.3"
dirs = "6.0.0"
governor = "0.10.2"
rand = { version = "0.10", features = ["std", "std_rng", "sys_rng", "thread_rng"] }
rand_core = "0.10"
sha2 = "0.10.9"
tracing = "0.1.41"

# Local development against an unpushed seismic-reth checkout. Remove once the
# `reth-seismic-engine-types` crate is on the pinned branch/rev above.
[patch."https://github.com/SeismicSystems/seismic-reth.git"]
reth-seismic-engine-types = { path = "../../seismic-reth-worktrees/seismic-reth/crates/seismic/engine-types" }
