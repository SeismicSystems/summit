name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"
      - name: build with default features
        run: cargo build
      - name: build without any features
        run: cargo build --no-default-features
      - name: build with prom feature
        run: cargo build --features prom
      - name: build with jemalloc feature
        run: cargo build --features jemalloc
      - name: build with all features
        run: cargo build --all-features

  warnings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "warnings-cache"
      - name: check warnings with default features
        run: RUSTFLAGS="-D warnings" cargo check
      - name: check warnings with all features
        run: RUSTFLAGS="-D warnings" cargo check --all-features

  # The two feature sets are not redundant: `bench` and `bad-blocks` swap in
  # alternative engine clients, so `--all-features` never exercises the
  # production block-building path that the default run covers.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            features: ""
            cache-key: "test-cache-default"
          - name: all features
            features: "--all-features"
            cache-key: "test-cache-all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}
      - name: cargo test
        run: cargo test ${{ matrix.features }}
