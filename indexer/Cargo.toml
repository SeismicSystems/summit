[package]
name = "quartz-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3.31"
tower-http = { version = "0.5", features = ["cors"] }
tower = "0.4"

commonware-codec ="0.0.54"

seismicbft-types.workspace = true
